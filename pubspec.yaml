name: openlab
description: "WiseBlood — Understand Your Health, Simply. AI-powered blood report analysis."
publish_to: 'none'
version: 1.0.8+19

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Firebase & Auth
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Charts
  fl_chart: ^0.70.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1

  # File Picking
  image_picker: ^1.1.2
  file_picker: ^8.1.8

  # In-App Purchases
  purchases_flutter: ^9.14.0

  # Utils
  intl: ^0.20.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.2
  purchases_ui_flutter: ^9.14.0

  # Local DB
  path_provider: ^2.1.5
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.9.1

  # Health Connect (Google Fit + Samsung Health)
  health: ^13.3.1
  shared_preferences: ^2.3.4

  # Sensor step counting fallback
  pedometer: ^4.0.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/images/wbappicon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/wbappicon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - assets/3d_isometric/
    - assets/images/
